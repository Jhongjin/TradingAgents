name: Post-trade review (proposals only)

# After the close, reviews each book's closed trades with the post_trade_review
# prompt and files the proposed rule changes on that book's latest run
# (metadata.post_trade_review). Nothing here changes a rule or places an order:
# the proposals wait for a person.
#
# The same record already reaches every morning decision as evidence
# (tradingagents/harness/track_record.py); this is the slower half of the loop.

on:
  workflow_dispatch:
  schedule:
    # 16:00 KST on weekdays, after the last intraday exit pass (15:20).
    - cron: "0 7 * * 1-5"

concurrency:
  group: harness-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRADINGAGENTS_POSTGRES_DRIVER: pg8000
      TRADINGAGENTS_ENABLE_LIVE_TRADING: "false"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Review each book
        run: |
          status=0
          for account in paper rules kis; do
            echo "::group::$account"
            tradingagents harness-review --account "$account" || status=1
            echo "::endgroup::"
          done
          exit $status
