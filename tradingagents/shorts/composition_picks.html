<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans KR"; font-weight: 300; src: local("Noto Sans KR Light"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 500; src: local("Noto Sans KR Medium"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 700; src: local("Noto Sans KR Bold"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 900; src: local("Noto Sans KR Black"), local("Noto Sans KR"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14102008; background-color: #141020; }

      :root {
        --ink: #eee9f6; --ink2: #a79ec0; --muted: #786f92;
        --risk: #ff5c60; --reward: #4ee6a8; --hair: #2b2440; --ground: #141020;
      }

      #root {
        width: 1080px; height: 1920px; position: relative; overflow: hidden;
        font-family: "Noto Sans KR", sans-serif; color: var(--ink);
        font-variant-numeric: tabular-nums;
        background:
          radial-gradient(1100px 900px at 8% 4%, rgba(78, 230, 168, 0.09), transparent 60%),
          radial-gradient(900px 800px at 94% 92%, rgba(12, 8, 22, 0.9), transparent 60%),
          linear-gradient(177deg, #1a1429 0%, #141020 48%, #0d0a16 100%);
      }
      .clip { position: absolute; inset: 0; z-index: 10; }

      #grain { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
      #grain .g {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: 0.03;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        animation: hf-grain 0.75s steps(1) infinite;
      }
      @keyframes hf-grain {
        0%,100% { transform: translate(0,0); } 20% { transform: translate(-8%,4%); }
        40% { transform: translate(6%,-7%); } 60% { transform: translate(-4%,9%); }
        80% { transform: translate(9%,2%); }
      }
      #swipe { position: absolute; top: 0; left: -320px; width: 300px; height: 1920px; z-index: 2;
               background: linear-gradient(90deg, transparent, rgba(78,230,168,0.07) 45%, rgba(78,230,168,0.18) 88%, transparent);
               transform: translateX(0); }

      .pad { position: absolute; left: 116px; right: 84px; }
      .kicker { font-weight: 500; font-size: 30px; color: var(--reward); letter-spacing: 0.06em; }
      .head { font-weight: 900; font-size: 66px; letter-spacing: -0.042em; line-height: 1.2; }
      .body { font-weight: 300; font-size: 34px; color: var(--ink2); line-height: 1.5; word-break: keep-all; }
      .unit { font-size: 0.38em; font-weight: 700; letter-spacing: -0.02em; }
      .mark { position: absolute; right: 84px; top: 1498px; font-weight: 300; font-size: 28px;
              color: var(--muted); z-index: 12; }

      /* ---- 1. how many ----------------------------------------------------- */
      #p1-mask { position: absolute; left: 104px; top: 460px; width: 900px; height: 300px; overflow: hidden; }
      #p1-fig { position: absolute; left: 0; top: 0; font-size: {{HERO_SIZE}}px; font-weight: 900;
                letter-spacing: -0.055em; line-height: 0.86; color: var(--ink); }
      #p1-rule { position: absolute; left: 116px; width: 880px; top: 996px; height: 4px;
                 background: var(--reward); transform-origin: left center; }

      /* ---- 2. the ladder each one is on ------------------------------------ */
      /* One holding: the stop on the left, the average on the middle mark, the
         target on the right. The red length is what was risked and the green
         length is what is being played for, drawn to the same price scale. */
      .rung { position: absolute; left: 116px; width: 880px; height: 190px; }
      .rung .nm { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 42px; letter-spacing: -0.035em; }
      .rung .rt { position: absolute; right: 0; top: 8px; font-weight: 500; font-size: 28px; color: var(--ink2); }
      .rung .track { position: absolute; left: 0; top: 96px; width: 880px; height: 3px; background: var(--hair); }
      .rung .risk { position: absolute; top: 90px; height: 15px; background: var(--risk);
                    transform-origin: right center; }
      .rung .reward { position: absolute; top: 90px; height: 15px; background: var(--reward);
                      transform-origin: left center; }
      .rung .pin { position: absolute; top: 76px; width: 4px; height: 43px; background: var(--ink); }
      .rung .lo { position: absolute; top: 130px; font-weight: 500; font-size: 26px; color: var(--risk); }
      .rung .hi { position: absolute; top: 130px; font-weight: 500; font-size: 26px; color: var(--reward); text-align: right; }
      .rung .av { position: absolute; top: 130px; font-weight: 500; font-size: 26px; color: var(--muted); }

      /* ---- 3. what that adds up to ----------------------------------------- */
      .tot { position: absolute; left: 116px; width: 880px; height: 130px; }
      .tot .k { position: absolute; left: 0; top: 24px; font-weight: 500; font-size: 34px; color: var(--ink2); }
      .tot .v { position: absolute; right: 0; top: 4px; font-weight: 900; font-size: 60px; letter-spacing: -0.04em; }
      .tot .rl { position: absolute; left: 0; top: 108px; width: 880px; height: 2px; background: var(--hair);
                 transform-origin: left center; }

      /* ---- 4. the outro ----------------------------------------------------- */
      #p4-rule { position: absolute; left: 116px; width: 880px; top: 760px; height: 4px;
                 background: var(--reward); transform-origin: left center; }
      .url { font-weight: 900; font-size: 74px; letter-spacing: -0.04em; color: var(--ink); }
      #tg-rule { position: absolute; left: 116px; width: 880px; top: 1052px; height: 2px;
                 background: var(--hair); transform-origin: left center; }
      .fine { font-weight: 300; font-size: 25px; line-height: 1.5; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}"
         data-width="1080" data-height="1920">

      <!-- 1. how many ------------------------------------------------------->
      <div class="clip" id="p1" data-start="0" data-duration="{{S1_DURATION}}" data-track-index="0">
        <p class="kicker pad" style="top: 300px;" id="p1-kick">{{KICKER}}</p>
        <div id="p1-mask"><p id="p1-fig">{{HERO_TEXT}}</p></div>
        <p class="body pad" style="top: 900px;" id="p1-cap">{{HOOK_CAPTION}}</p>
        <div id="p1-rule"></div>
        <div class="pad" style="top: 1052px;">
          <p class="head" id="p1-l1">{{LINE1}}</p>
          <p class="head" id="p1-l2">{{LINE2}}</p>
        </div>
      </div>

      <!-- 2. the ladder ----------------------------------------------------->
      <div class="clip" id="p2" data-start="{{S2_START}}" data-duration="{{S2_DURATION}}" data-track-index="0">
        <p class="head pad" style="top: 280px;" id="p2-head">{{RUNGS_HEAD}}</p>
        {{RUNGS}}
        <p class="body pad" style="top: {{RUNGS_NOTE_TOP}}px;" id="p2-note">{{RUNGS_NOTE}}</p>
      </div>

      <!-- 3. what that adds up to -------------------------------------------->
      <div class="clip" id="p3" data-start="{{S3_START}}" data-duration="{{S3_DURATION}}" data-track-index="0">
        <p class="head pad" style="top: 300px;" id="p3-head">{{TOTALS_HEAD}}</p>
        {{TOTALS}}
        <p class="body pad" style="top: {{TOTALS_NOTE_TOP}}px;" id="p3-note">{{TOTALS_NOTE}}</p>
      </div>

      <!-- 4. the outro ------------------------------------------------------>
      <div class="clip" id="p4" data-start="{{S4_START}}" data-duration="{{S4_DURATION}}" data-track-index="0">
        <div class="pad" style="top: 560px;">
          <p class="head" id="p4-l1">{{OUTRO1}}</p>
          <p class="head" id="p4-l2">{{OUTRO2}}</p>
        </div>
        <div id="p4-rule"></div>
        <p class="body pad" style="top: 800px;" id="p4-call">{{OUTRO_CALL}}</p>
        <p class="url pad" style="top: 858px;" id="p4-url">{{URL}}</p>
        <div id="tg-rule"></div>
        <div class="pad" style="top: 1090px;" id="p4-tg">
          <p class="fine" style="color: var(--ink2);">{{TELEGRAM_LINE}}</p>
          <p class="url" style="font-size: 54px; margin-top: 14px;">{{TELEGRAM}}</p>
        </div>
        <p class="fine pad" style="top: 1300px;" id="p4-fine">AI 실험 기록이며 매매 권유가 아닙니다.</p>
      </div>

      <p class="mark">{{URL}}</p>
      <div id="swipe"></div>
      <div id="grain"><div class="g"></div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function cut(at) {
        tl.fromTo("#swipe", { x: 0 }, { x: 1420, duration: 0.5, ease: "power2.inOut" }, at - 0.22);
      }

      // --- 1. how many -------------------------------------------------------
      tl.fromTo("#p1-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.32 }, 0)
        .fromTo("#p1-fig", { yPercent: 42, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, 0.1)
        .fromTo("#p1-cap", { opacity: 0 }, { opacity: 1, duration: 0.32 }, 0.66)
        .fromTo("#p1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power3.out" }, 0.78)
        .fromTo("#p1-l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34 }, 0.98)
        .fromTo("#p1-l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34 }, 1.13);

      // --- 2. both lengths grow out of the price that was paid ----------------
      // Risk and reward leave the same pin at the same moment, so which one is
      // longer is seen instead of being worked out from two numbers.
      const S2 = {{S2_START}}, RUNGS = {{RUNG_COUNT}};
      cut(S2);
      tl.fromTo("#p2-head", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S2);
      for (let i = 0; i < RUNGS; i += 1) {
        const at = S2 + 0.42 + i * 0.6;
        const node = "#rung" + i;
        tl.fromTo(node + " .nm", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.32 }, at)
          .fromTo(node + " .track", { opacity: 0 }, { opacity: 1, duration: 0.26 }, at + 0.06)
          .fromTo(node + " .pin", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.26 }, at + 0.12)
          .fromTo(node + " .risk", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at + 0.2)
          .fromTo(node + " .reward", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at + 0.2)
          .fromTo(node + " .lo, " + node + " .hi, " + node + " .av", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.46)
          .fromTo(node + " .rt", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.5);
      }
      tl.fromTo("#p2-note", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S2 + 0.5 + RUNGS * 0.6);

      // --- 3. what that adds up to ---------------------------------------------
      const S3 = {{S3_START}}, TOTALS = {{TOTALS_COUNT}};
      cut(S3);
      tl.fromTo("#p3-head", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S3);
      for (let i = 0; i < TOTALS; i += 1) {
        const at = S3 + 0.4 + i * 0.42;
        const node = "#tot" + i;
        tl.fromTo(node + " .k", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3 }, at)
          .fromTo(node + " .rl", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.out" }, at)
          .fromTo(node + " .v", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.32, ease: "back.out(2)" }, at + 0.1);
      }
      tl.fromTo("#p3-note", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S3 + 0.5 + TOTALS * 0.42);

      // --- 4. outro --------------------------------------------------------------
      const S4 = {{S4_START}};
      cut(S4);
      tl.fromTo("#p4-l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32 }, S4)
        .fromTo("#p4-l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32 }, S4 + 0.16)
        .fromTo("#p4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power3.out" }, S4 + 0.38)
        .fromTo("#p4-call", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S4 + 0.5)
        .fromTo("#p4-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S4 + 0.64)
        .fromTo("#tg-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46 }, S4 + 1.05)
        .fromTo("#p4-tg", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S4 + 1.18)
        .fromTo("#p4-fine", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S4 + 1.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
