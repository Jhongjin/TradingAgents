<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans KR"; font-weight: 300; src: local("Noto Sans KR Light"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 500; src: local("Noto Sans KR Medium"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 700; src: local("Noto Sans KR Bold"), local("Noto Sans KR"); }
      @font-face { font-family: "Noto Sans KR"; font-weight: 900; src: local("Noto Sans KR Black"), local("Noto Sans KR"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* The one cut on a light ground. Four dark videos in a row on a channel
         page read as one upload repeated; this one has to be the odd tile. */
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eeebe4; }

      :root {
        --ink: #14161a; --ink2: #3e434b; --muted: #5c5852;
        --accent: #a8301f; --keep: #14161a; --drop: #8d8a83;
        --hair: #cfc9bd; --ground: #eeebe4;
      }

      #root {
        width: 1080px; height: 1920px; position: relative; overflow: hidden;
        font-family: "Noto Sans KR", sans-serif; color: var(--ink);
        font-variant-numeric: tabular-nums;
        background:
          radial-gradient(1200px 900px at 6% 2%, rgba(255, 255, 255, 0.85), transparent 58%),
          radial-gradient(900px 800px at 96% 94%, rgba(196, 188, 172, 0.55), transparent 62%),
          linear-gradient(176deg, #f4f1ea 0%, #eeebe4 48%, #e6e1d6 100%);
      }
      .clip { position: absolute; inset: 0; z-index: 10; }

      #grain { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
      #grain .g {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: 0.045;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        animation: hf-grain 0.75s steps(1) infinite;
      }
      @keyframes hf-grain {
        0%,100% { transform: translate(0,0); } 20% { transform: translate(-8%,4%); }
        40% { transform: translate(6%,-7%); } 60% { transform: translate(-4%,9%); }
        80% { transform: translate(9%,2%); }
      }
      #swipe { position: absolute; top: 0; left: -320px; width: 300px; height: 1920px; z-index: 2;
               background: linear-gradient(90deg, transparent, rgba(20,22,26,0.06) 45%, rgba(20,22,26,0.16) 88%, transparent);
               transform: translateX(0); }

      .pad { position: absolute; left: 116px; right: 84px; }
      .kicker { font-weight: 500; font-size: 30px; color: var(--muted); letter-spacing: 0.06em; }
      .head { font-weight: 900; font-size: 66px; letter-spacing: -0.042em; line-height: 1.2; }
      .body { font-weight: 300; font-size: 34px; color: var(--ink2); line-height: 1.5; word-break: keep-all; }
      .unit { font-size: 0.38em; font-weight: 700; letter-spacing: -0.02em; }
      .mark { position: absolute; right: 84px; top: 1498px; font-weight: 500; font-size: 28px;
              color: var(--muted); z-index: 12; }

      /* ---- 1. the number it starts from ---------------------------------- */
      #f1-mask { position: absolute; left: 104px; top: 470px; width: 900px; height: 300px; overflow: hidden; }
      #f1-fig { position: absolute; left: 0; top: 0; font-size: {{HERO_SIZE}}px; font-weight: 900;
                letter-spacing: -0.055em; line-height: 0.86; color: var(--ink); }
      #f1-rule { position: absolute; left: 116px; width: 880px; top: 996px; height: 4px;
                 background: var(--accent); transform-origin: left center; }

      /* ---- 2. the funnel -------------------------------------------------- */
      .stage { position: absolute; left: 116px; width: 880px; height: 132px; }
      .stage .bar { position: absolute; left: 0; top: 46px; width: 880px; height: 58px;
                    background: var(--keep); transform-origin: left center; }
      .stage .k { position: absolute; left: 0; top: 0; font-weight: 500; font-size: 30px; color: var(--ink2); }
      .stage .n { position: absolute; left: 0; top: 46px; height: 58px; line-height: 58px;
                  padding-left: 22px; font-weight: 900; font-size: 40px; letter-spacing: -0.03em;
                  color: var(--ground); }
      .stage .cut { position: absolute; right: 0; top: 0; font-weight: 700; font-size: 30px;
                    color: var(--accent); letter-spacing: -0.02em; }

      /* ---- 3. what came out ----------------------------------------------- */
      .pick { position: absolute; left: 116px; width: 880px; height: 122px; }
      .pick .nm { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 46px; letter-spacing: -0.035em; }
      .pick .sb { position: absolute; left: 0; top: 60px; font-weight: 300; font-size: 27px; color: var(--muted); }
      .pick .vv { position: absolute; right: 0; top: 6px; font-weight: 900; font-size: 44px;
                  letter-spacing: -0.035em; color: var(--accent); }
      .pick .rl { position: absolute; left: 0; top: 108px; width: 880px; height: 2px;
                  background: var(--hair); transform-origin: left center; }

      /* ---- 4. the outro --------------------------------------------------- */
      #f4-rule { position: absolute; left: 116px; width: 880px; top: 760px; height: 4px;
                 background: var(--accent); transform-origin: left center; }
      .url { font-weight: 900; font-size: 74px; letter-spacing: -0.04em; color: var(--ink); }
      #tg-rule { position: absolute; left: 116px; width: 880px; top: 1052px; height: 2px;
                 background: var(--hair); transform-origin: left center; }
      .fine { font-weight: 300; font-size: 25px; line-height: 1.5; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}"
         data-width="1080" data-height="1920">

      <!-- 1. the number it starts from -------------------------------------->
      <div class="clip" id="f1" data-start="0" data-duration="{{S1_DURATION}}" data-track-index="0">
        <p class="kicker pad" style="top: 300px;" id="f1-kick">{{KICKER}}</p>
        <div id="f1-mask"><p id="f1-fig">{{HERO_TEXT}}</p></div>
        <p class="body pad" style="top: 900px;" id="f1-cap">{{HOOK_CAPTION}}</p>
        <div id="f1-rule"></div>
        <div class="pad" style="top: 1052px;">
          <p class="head" id="f1-l1">{{LINE1}}</p>
          <p class="head" id="f1-l2">{{LINE2}}</p>
        </div>
      </div>

      <!-- 2. the funnel ----------------------------------------------------->
      <div class="clip" id="f2" data-start="{{S2_START}}" data-duration="{{S2_DURATION}}" data-track-index="0">
        <p class="head pad" style="top: 280px;" id="f2-head">{{FUNNEL_HEAD}}</p>
        {{STAGES}}
        <p class="body pad" style="top: {{FUNNEL_NOTE_TOP}}px;" id="f2-note">{{FUNNEL_NOTE}}</p>
      </div>

      <!-- 3. what came out --------------------------------------------------->
      <div class="clip" id="f3" data-start="{{S3_START}}" data-duration="{{S3_DURATION}}" data-track-index="0">
        <p class="head pad" style="top: 300px;" id="f3-head">{{PICKS_HEAD}}</p>
        {{PICKS}}
        <p class="body pad" style="top: {{PICKS_NOTE_TOP}}px;" id="f3-note">{{PICKS_NOTE}}</p>
      </div>

      <!-- 4. the outro ------------------------------------------------------>
      <div class="clip" id="f4" data-start="{{S4_START}}" data-duration="{{S4_DURATION}}" data-track-index="0">
        <div class="pad" style="top: 560px;">
          <p class="head" id="f4-l1">{{OUTRO1}}</p>
          <p class="head" id="f4-l2">{{OUTRO2}}</p>
        </div>
        <div id="f4-rule"></div>
        <p class="body pad" style="top: 800px;" id="f4-call">{{OUTRO_CALL}}</p>
        <p class="url pad" style="top: 858px;" id="f4-url">{{URL}}</p>
        <div id="tg-rule"></div>
        <div class="pad" style="top: 1090px;" id="f4-tg">
          <p class="fine" style="color: var(--ink2);">{{TELEGRAM_LINE}}</p>
          <p class="url" style="font-size: 54px; margin-top: 14px;">{{TELEGRAM}}</p>
        </div>
        <p class="fine pad" style="top: 1300px;" id="f4-fine">AI 실험 기록이며 매매 권유가 아닙니다.</p>
      </div>

      <p class="mark">{{URL}}</p>
      <div id="swipe"></div>
      <div id="grain"><div class="g"></div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function cut(at) {
        tl.fromTo("#swipe", { x: 0 }, { x: 1420, duration: 0.5, ease: "power2.inOut" }, at - 0.22);
      }

      // --- 1. the number it starts from -------------------------------------
      tl.fromTo("#f1-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.32 }, 0)
        .fromTo("#f1-fig", { yPercent: 42, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, 0.1)
        .fromTo("#f1-cap", { opacity: 0 }, { opacity: 1, duration: 0.32 }, 0.66)
        .fromTo("#f1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power3.out" }, 0.78)
        .fromTo("#f1-l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34 }, 0.98)
        .fromTo("#f1-l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34 }, 1.13);

      // --- 2. the funnel -----------------------------------------------------
      // Each bar starts at the width of the one above it and shrinks to its
      // own, so the drop is the movement rather than a number stated after it.
      const S2 = {{S2_START}}, STAGES = {{STAGE_VALUES}};
      cut(S2);
      tl.fromTo("#f2-head", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S2);
      STAGES.forEach(function (row, i) {
        const at = S2 + 0.42 + i * 0.52;
        const node = "#stage" + i;
        const tally = { v: row.from };
        const numberNode = document.querySelector(node + " .n");
        tl.fromTo(node + " .k", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3 }, at)
          .fromTo(node + " .bar", { scaleX: row.fromScale }, { scaleX: row.scale, duration: 0.62, ease: "power3.inOut" }, at + 0.08)
          .fromTo(node + " .n", { opacity: 0 }, { opacity: 1, duration: 0.24 }, at + 0.12)
          .to(tally, {
            v: row.to, duration: 0.62, ease: "power3.inOut",
            onUpdate: function () {
              if (numberNode) numberNode.textContent = Math.round(tally.v) + "종목";
            },
          }, at + 0.08);
        if (row.cut > 0) {
          tl.fromTo(node + " .cut", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.3 }, at + 0.56);
        }
      });
      tl.fromTo("#f2-note", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S2 + 0.5 + STAGES.length * 0.52);

      // --- 3. what came out ---------------------------------------------------
      const S3 = {{S3_START}}, PICKS = {{PICK_COUNT}};
      cut(S3);
      tl.fromTo("#f3-head", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S3);
      for (let i = 0; i < PICKS; i += 1) {
        const at = S3 + 0.4 + i * 0.4;
        const node = "#pick" + i;
        tl.fromTo(node + " .nm", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.32 }, at)
          .fromTo(node + " .sb", { opacity: 0 }, { opacity: 1, duration: 0.28 }, at + 0.1)
          .fromTo(node + " .vv", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.3 }, at + 0.12)
          .fromTo(node + " .rl", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.out" }, at + 0.06);
      }
      tl.fromTo("#f3-note", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S3 + 0.5 + PICKS * 0.4);

      // --- 4. outro ------------------------------------------------------------
      const S4 = {{S4_START}};
      cut(S4);
      tl.fromTo("#f4-l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32 }, S4)
        .fromTo("#f4-l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32 }, S4 + 0.16)
        .fromTo("#f4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power3.out" }, S4 + 0.38)
        .fromTo("#f4-call", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S4 + 0.5)
        .fromTo("#f4-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S4 + 0.64)
        .fromTo("#tg-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46 }, S4 + 1.05)
        .fromTo("#f4-tg", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36 }, S4 + 1.18)
        .fromTo("#f4-fine", { opacity: 0 }, { opacity: 1, duration: 0.36 }, S4 + 1.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
